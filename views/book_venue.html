<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SportSpot — Book a Venue</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --panel: #13161d;
      --border: #1f2330;
      --accent: #c8a96e;
      --text: #e8e6e0;
      --muted: #6b6f7c;
      --card-bg: #191c25;
      --card-border: #252837;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Blobs ── */
    .blob { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(80px); z-index: 0; }
    .blob-1 { width: 600px; height: 600px; top: -200px; left: 50%; transform: translateX(-50%); background: radial-gradient(circle, rgba(200,169,110,0.08), transparent 70%); }
    .blob-2 { width: 400px; height: 400px; bottom: -100px; right: -80px; background: radial-gradient(circle, rgba(80,100,200,0.07), transparent 70%); }

    @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

    .step {
      position: relative; z-index: 1;
      max-width: 780px; margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 0.875rem; text-decoration: none;
      margin-bottom: 44px; transition: color 0.18s; cursor: pointer; border: none; background: none;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 16px; height: 16px; stroke: currentColor; }

    /* ── Step 1 ── */
    .header { text-align: center; margin-bottom: 52px; animation: fadeUp 0.5s ease both; }
    .heading { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,2.6rem); font-weight:700; line-height:1.15; margin-bottom:12px; }
    .heading em { font-style:normal; color:var(--accent); }
    .sub { font-size:0.95rem; color:var(--muted); font-weight:300; line-height:1.65; }

    .sports-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }

    .sport-card {
      position: relative; cursor: pointer;
      border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--panel); padding: 28px 20px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      transition: transform 0.22s ease, border-color 0.22s ease;
      animation: fadeUp 0.5s ease both; user-select: none;
    }
    .sport-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .sport-card:hover { transform: translateY(-4px); }

    .s-cricket    { --c: 200,169,110; }
    .s-football   { --c: 80,200,120;  }
    .s-basketball { --c: 240,130,60;  }
    .s-pickleball { --c: 100,180,240; }
    .s-badminton  { --c: 200,100,220; }

    .sport-card:hover { border-color: rgba(var(--c),0.45); }
    .sport-card.selected { border-color: rgba(var(--c),0.75); background: rgba(var(--c),0.05); transform: translateY(-5px); }

    .sport-emoji { font-size: 2.6rem; line-height: 1; filter: drop-shadow(0 0 10px rgba(var(--c),0.25)); }
    .sport-name { font-family:'Playfair Display',serif; font-size:1.08rem; font-weight:600; color:var(--text); }
    .sport-tag { font-size:10.5px; font-weight:500; letter-spacing:0.07em; text-transform:uppercase; color:rgba(var(--c),0.6); background:rgba(var(--c),0.08); border:1px solid rgba(var(--c),0.18); border-radius:99px; padding:3px 10px; }

    .cta-wrap { display:flex; justify-content:center; }
    .cta-btn {
      display:inline-flex; align-items:center; gap:10px;
      padding:15px 36px; border-radius:14px;
      font-family:'DM Sans',sans-serif; font-size:0.95rem; font-weight:500;
      cursor:pointer; border:none; background:var(--accent); color:#0d0f14;
      transition:opacity 0.2s, transform 0.18s; text-decoration: none;
    }
    .cta-btn:hover { opacity:0.88; transform:translateY(-2px); }
    .cta-btn svg { width:17px; height:17px; stroke:#0d0f14; stroke-width:2.2; }

    /* ── Step 2 ── */
    #step2 { max-width: 900px; }
    .sport-pill { display:inline-flex; align-items:center; gap:8px; padding:5px 16px; border-radius:99px; border:1px solid rgba(200,169,110,0.3); background:rgba(200,169,110,0.08); font-size:12px; font-weight:500; color:var(--accent); text-transform:uppercase; margin-bottom:16px; }
    .venues-heading { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,4.5vw,2.4rem); font-weight:700; margin-bottom:8px; }
    .venues-sub { font-size:0.9rem; color:var(--muted); }
    .venues-header { margin-bottom:40px; }

    .datebar { display:flex; align-items:flex-end; gap:14px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:22px 26px; margin-bottom:44px; }
    .datebar-label { font-size:11px; font-weight:500; color:var(--muted); letter-spacing:0.07em; text-transform:uppercase; margin-bottom:8px; }
    .date-field { flex:1; display:flex; flex-direction:column; }
    .date-input { background:var(--card-bg); border:1px solid var(--card-border); border-radius:11px; padding:11px 16px; color:var(--text); font-family:'DM Sans',sans-serif; outline:none; color-scheme:dark; }

    .search-btn { display:inline-flex; align-items:center; gap:9px; padding:12px 26px; border-radius:11px; background:var(--accent); color:#0d0f14; font-weight:500; border:none; cursor:pointer; }

    /* Venues List Elements */
    #venuesList { display:flex; flex-direction:column; gap:20px; }
    .venue-card { background:var(--panel); border:1px solid var(--border); border-radius:22px; overflow:hidden; transition: transform 0.2s ease; }
    .venue-card:hover { transform: translateY(-2px); }
    .venue-top { display:flex; align-items:center; gap:20px; padding:24px; }
    .venue-img-placeholder { width:88px; height:72px; border-radius:13px; background:var(--card-bg); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
    .venue-info { flex:1; min-width:0; }
    .venue-name { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:600; margin-bottom:6px; color: var(--text); }
    .venue-meta { display:flex; flex-direction: column; gap: 6px; font-size:0.9rem; }
    .venue-address-text { color: var(--text); display: flex; align-items: center; gap: 4px; }
    .venue-host-text { color: var(--muted); font-size: 0.825rem; }
    .venue-host-text strong { color: var(--accent); font-weight: 500; }

    .view-slots-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 12px 24px; background: var(--accent); color: #0d0f14;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600;
      border-radius: 11px; text-decoration: none; white-space: nowrap;
      transition: opacity 0.15s, transform 0.15s;
    }
    .view-slots-btn:hover { opacity: 0.88; }
    .view-slots-btn svg { width: 15px; height: 15px; stroke: #0d0f14; stroke-width: 2.5; }

    @media (max-width: 600px) {
      .sports-grid { grid-template-columns: repeat(2,1fr); }
      .venue-top { flex-direction: column; align-items: flex-start; gap: 16px; }
      .view-slots-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- ════════════════════════════════════════════════════════════════════════
       STEP 1 — SPORT SELECTION
       =========================================================================
       BACKEND DEV NOTE: If your routing configuration does not have a 
       'sport' parameter in the URL request yet, render this block.
       ════════════════════════════════════════════════════════════════════════ -->
  <div class="step" id="step1">
    <header class="header">
      <h1 class="heading">Pick your <em>sport</em></h1>
      <p class="sub">What do you want to play? We'll find it for you.</p>
    </header>

    <!-- Submits form selections instantly back to the parent URL router path -->
    <form action="" method="GET">
      <div class="sports-grid">
        <label class="sport-card s-cricket" onclick="highlightSport(this)">
          <input type="radio" name="sport" value="cricket" required />
          <div class="sport-emoji">🏏</div>
          <div class="sport-name">Cricket</div>
          <div class="sport-tag">Bat &amp; ball</div>
        </label>

        <label class="sport-card s-football" onclick="highlightSport(this)">
          <input type="radio" name="sport" value="football" />
          <div class="sport-emoji">⚽</div>
          <div class="sport-name">Football</div>
          <div class="sport-tag">Team sport</div>
        </label>

        <label class="sport-card s-basketball" onclick="highlightSport(this)">
          <input type="radio" name="sport" value="basketball" />
          <div class="sport-emoji">🏀</div>
          <div class="sport-name">Basketball</div>
          <div class="sport-tag">Court game</div>
        </label>

        <label class="sport-card s-pickleball" onclick="highlightSport(this)">
          <input type="radio" name="sport" value="pickleball" />
          <div class="sport-emoji">🏓</div>
          <div class="sport-name">Pickleball</div>
          <div class="sport-tag">Racquet sport</div>
        </label>

        <label class="sport-card s-badminton" onclick="highlightSport(this)">
          <input type="radio" name="sport" value="badminton" />
          <div class="sport-emoji">🏸</div>
          <div class="sport-name">Badminton</div>
          <div class="sport-tag">Shuttle sport</div>
        </label>
      </div>

      <div class="cta-wrap">
        <button type="submit" class="cta-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          Find venues
        </button>
      </div>
    </form>
  </div>


  <!-- ════════════════════════════════════════════════════════════════════════
       STEP 2 — VENUE OVERVIEW LISTING
       =========================================================================
       BACKEND DEV NOTE: If your router path catches 'sport' as a parameter,
       hide Step 1, make this container block visible, and render your loop logic.
       ════════════════════════════════════════════════════════════════════════ -->
  <div class="step" id="step2" style="display: none;">
    
    <!-- Resets url tracking states back to defaults -->
    <a href="?" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Change sport
    </a>

    <header class="venues-header">
      <!-- Dynamic text replacement container for target labels -->
      <div class="sport-pill" id="sportPill">🏏 Cricket</div>
      <h1 class="venues-heading">Find a <em>venue</em> near you</h1>
      <p class="venues-sub">Pick a date and we'll show what's available.</p>
    </header>

    <form action="" method="GET">
      <!-- Hidden tag retains active context during form submission cycles -->
      <input type="hidden" name="sport" value="cricket" id="hiddenSportInput" />

      <div class="datebar">
        <div class="date-field">
          <div class="datebar-label">Select date</div>
          <!-- Automatically auto-submits parent form fields on interactive changes -->
          <input type="date" class="date-input" name="date" id="dateInput" required onchange="this.form.submit()" />
        </div>
        <button type="submit" class="search-btn">Search</button>
      </div>
    </form>

    <!-- 
      =========================================================================
      BACKEND PROCESSING HOOK:
      Iterate through your server response collection retrieved from:
      `/booking/api?sport=${selectedSport}`
      =========================================================================
    -->
    <div id="venuesList">

      <!-- START BACKEND FOREACH/MAP LOOP PREVIEW TEMPLATE -->
      <div class="venue-card">
        <div class="venue-top">
          <div class="venue-img-placeholder">🏟️</div>
          
          <div class="venue-info">
            <!-- Matches Key: venue_name -->
            <div class="venue-name">CM BOX CRICKET</div>
            
            <div class="venue-meta">
              <!-- Matches Key: venue_address -->
              <span class="venue-address-text">📍 Chenpur underpass, ahmedabad</span>
              <!-- Matches Key: fullname -->
              <span class="venue-host-text">👤 Hosted by: <strong>Hepi Soni</strong></span>
            </div>
          </div>
          
          <!-- 
            ACTION BUTTON: 
            Passes the database Object '_id' string via link query strings 
            down into your separate detailed slot viewer routing system page.
          -->
          <a href="/booking/details?id=6a2155d98db0df9c7a0616bf&date=2026-06-04&sport=cricket" class="view-slots-btn">
            View Slots
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        </div>
      </div>
      <!-- END BACKEND FOREACH/MAP LOOP PREVIEW TEMPLATE -->

    </div>
  </div>

  <script>
    // Visual management tracking for radio choices
    function highlightSport(element) {
      document.querySelectorAll('.sport-card').forEach(c => c.classList.remove('selected'));
      element.classList.add('selected');
    }

    // Interactive fallback parsing simulation to preview dynamic routes locally.
    // Safe to drop completely once your application is wireframe integrated.
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const di = document.getElementById('dateInput');
      if (di && !di.value) {
        di.min = today;
        di.value = today;
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('sport')) {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        
        const sportVal = urlParams.get('sport');
        document.getElementById('hiddenSportInput').value = sportVal;
        
        // Match chosen parameters up with active navigation indicator metrics
        const emojiMap = { cricket:'🏏', football:'⚽', basketball:'🏀', pickleball:'🏓', badminton:'🏸' };
        const label = sportVal.charAt(0).toUpperCase() + sportVal.slice(1);
        document.getElementById('sportPill').textContent = `${emojiMap[sportVal] || '🏟️'} ${label}`;
      }
    });
  </script>
</body>
</html>
